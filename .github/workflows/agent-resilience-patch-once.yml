name: Agent resilience patch once

on:
  push:
    branches: [feat/hector-agent-resilience-broker-20260822]
    paths:
      - '.github/workflows/agent-resilience-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hector-agent-resilience-broker-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire broker and persistent checkpoints
        shell: python
        run: |
          from pathlib import Path

          route = Path('worker/routes/hector-agent.ts')
          text = route.read_text()
          import_marker = "import {workModeTitle} from '../lib/work-mode';"
          import_line = "import {hectorAgentResilience} from './hector-agent-resilience';"
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('hector-agent import marker missing')
              text = text.replace(import_marker, import_marker + "\n" + import_line, 1)
          mount_marker = "hectorAgent.use('*',requireAuth);"
          mount_line = "hectorAgent.route('/resilience',hectorAgentResilience);"
          if mount_line not in text:
              if mount_marker not in text:
                  raise SystemExit('hector-agent mount marker missing')
              text = text.replace(mount_marker, mount_marker + "\n" + mount_line, 1)
          route.write_text(text)

          index = Path('worker/index.ts')
          text = index.read_text()
          runtime_import = "import {blockHectorAgentJob,hectorAgentLimitReason,loadHectorAgentRuntimeGuard,recordHectorAgentCycle} from './lib/hector-agent-runtime';"
          resilience_import = "import {completeResumeCheckpoints,saveResumeCheckpoint} from './lib/hector-agent-resilience';"
          if resilience_import not in text:
              if runtime_import not in text:
                  raise SystemExit('runtime import marker missing')
              text = text.replace(runtime_import, runtime_import + "\n" + resilience_import, 1)

          wait_marker = "const delay=parsed.state==='waiting'?parsed.retryAfterMinutes:2,progress=Math.min(95,15+Number(job.attempt_count||1)*4),wait=`+${delay} minutes`;"
          wait_insert = wait_marker + "\n    await saveResumeCheckpoint(env,{workJobId:job.id,reason:parsed.state==='waiting'?'external_dependency':'continuation',state:{result:parsed.text,attemptCount:job.attempt_count},status:parsed.state==='waiting'?'waiting_external':'ready',resumeAfter:new Date(Date.now()+delay*60_000).toISOString()});"
          if "reason:parsed.state==='waiting'?'external_dependency':'continuation'" not in text:
              if wait_marker not in text:
                  raise SystemExit('wait checkpoint marker missing')
              text = text.replace(wait_marker, wait_insert, 1)

          completed_marker = "const completed=await env.DB.prepare(\"UPDATE work_jobs SET status='completed',progress=100,result=?,last_error=NULL,lease_token=NULL,lease_expires_at=NULL,next_retry_at=NULL,heartbeat_at=CURRENT_TIMESTAMP,updated_at=CURRENT_TIMESTAMP WHERE id=? AND lease_token=?\").bind(out.text,job.id,leaseToken).run();if(!completed.meta.changes)return;"
          completed_insert = completed_marker + "\n  await completeResumeCheckpoints(env,job.id);"
          if "await completeResumeCheckpoints(env,job.id);" not in text:
              if completed_marker not in text:
                  raise SystemExit('completion checkpoint marker missing')
              text = text.replace(completed_marker, completed_insert, 1)

          failure_marker = "if(failed.meta.changes){await event(env,job.id,`Error detectado; Modo Trabajo conservará el avance e intentará otra alternativa en ${retry.delaySeconds}s`,25);await recordExperience(env,{jobId:job.id,userId:job.user_id,objective:job.prompt,status:'queued',result:message,skills:plan.skills,attempts:job.attempt_count,durationMs:Date.now()-started});}"
          failure_insert = "if(failed.meta.changes){await saveResumeCheckpoint(env,{workJobId:job.id,reason:'retry_after_error',state:{error:message,attemptCount:job.attempt_count},status:'ready',resumeAfter:new Date(Date.now()+retry.delaySeconds*1000).toISOString()});await event(env,job.id,`Error detectado; Modo Trabajo conservará el avance e intentará otra alternativa en ${retry.delaySeconds}s`,25);await recordExperience(env,{jobId:job.id,userId:job.user_id,objective:job.prompt,status:'queued',result:message,skills:plan.skills,attempts:job.attempt_count,durationMs:Date.now()-started});}"
          if "reason:'retry_after_error'" not in text:
              if failure_marker not in text:
                  raise SystemExit('failure checkpoint marker missing')
              text = text.replace(failure_marker, failure_insert, 1)
          index.write_text(text)

          Path('.github/workflows/agent-resilience-patch-once.yml').unlink()
      - name: Install and verify
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/hector-agent-runtime.test.ts tests/hector-agent-v1.test.ts
      - name: Commit wired implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/routes/hector-agent.ts worker/index.ts .github/workflows/agent-resilience-patch-once.yml
          git commit -m 'feat(agent): wire resilience broker into runtime'
          git push origin HEAD:feat/hector-agent-resilience-broker-20260822
