name: NPM Audit Triage

on:
  push:
    branches: ['chore/npm-audit-triage-20260822']

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/npm-audit-triage-20260822
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Capture audit before remediation
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/audit-before.json
          npm audit --omit=dev --json > /tmp/audit-prod-before.json
          exit 0
      - name: Apply compatible lockfile-only remediation
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only
          echo "audit_fix_exit=$?"
          exit 0
      - name: Reinstall and validate repository
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --passWithNoTests
          npm run build
      - name: Capture audit after remediation
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/audit-after.json
          npm audit --omit=dev --json > /tmp/audit-prod-after.json
          exit 0
      - name: Publish exact audit evidence to PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const summarize=(a)=>({
            metadata:a.metadata?.vulnerabilities||{},
            items:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({
              name,severity:v.severity,isDirect:v.isDirect,range:v.range,
              effects:v.effects,fixAvailable:v.fixAvailable,
              via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,severity:x.severity,title:x.title,url:x.url,range:x.range})
            }))
          });
          const before=summarize(read('/tmp/audit-before.json'));
          const prodBefore=summarize(read('/tmp/audit-prod-before.json'));
          const after=summarize(read('/tmp/audit-after.json'));
          const prodAfter=summarize(read('/tmp/audit-prod-after.json'));
          const body=[
            '## Evidencia automática de npm audit',
            '',
            `**Antes — completo:** \`${JSON.stringify(before.metadata)}\``,
            `**Antes — producción:** \`${JSON.stringify(prodBefore.metadata)}\``,
            `**Después — completo:** \`${JSON.stringify(after.metadata)}\``,
            `**Después — producción:** \`${JSON.stringify(prodAfter.metadata)}\``,
            '',
            '### Vulnerabilidades después',
            '```json',JSON.stringify(after.items,null,2),'```',
            '',
            '### Vulnerabilidades de producción después',
            '```json',JSON.stringify(prodAfter.items,null,2),'```'
          ].join('\n');
          fs.writeFileSync('/tmp/audit-comment.md',body);
          NODE
          gh pr comment 998 --body-file /tmp/audit-comment.md
      - name: Commit compatible lockfile update
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes produced by npm audit fix.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: apply compatible npm audit lockfile fixes'
          git push origin HEAD:chore/npm-audit-triage-20260822
