name: PWA governance branch patch

on:
  push:
    branches:
      - fix/pwa-governance-coordination
    paths:
      - .github/workflows/pwa-governance-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-governance-coordination
          fetch-depth: 0
      - name: Gate PWA Factory behind explicit new-PWA approval
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('worker/routes/pwa-factory.ts')
          text=path.read_text()
          schema_old="  offline:z.boolean().default(true)\n});"
          schema_new="  offline:z.boolean().default(true),\n  approvedNewPwa:z.boolean().default(false),\n  approvalReason:z.string().trim().min(8).max(500).optional()\n});"
          if 'approvedNewPwa' not in text:
              if schema_old not in text:
                  raise SystemExit('createSchema anchor not found')
              text=text.replace(schema_old,schema_new,1)
          anchor="if(!parsed.success)return c.json({error:'Especificación inválida',details:parsed.error.flatten()},400);const uid="
          gate="if(!parsed.success)return c.json({error:'Especificación inválida',details:parsed.error.flatten()},400);if(parsed.data.approvedNewPwa!==true)return c.json({error:'Nueva PWA bloqueada por gobernanza: reutiliza una superficie canónica o solicita autorización explícita para crear una PWA nueva.',code:'pwa_registry_reuse_required',registry:'config/pwa-registry.json',canonicalPwas:['hector-os','hector-agent','pendientes']},409);if(!parsed.data.approvalReason?.trim())return c.json({error:'Falta documentar la autorización explícita para la nueva PWA',code:'pwa_explicit_approval_reason_required'},400);const uid="
          if 'pwa_registry_reuse_required' not in text:
              if anchor not in text:
                  raise SystemExit('POST create anchor not found')
              text=text.replace(anchor,gate,1)
          path.write_text(text)
          PY
          rm .github/workflows/pwa-governance-branch-patch.yml
          git config user.name "Hector35"
          git config user.email "67966310+Hector35@users.noreply.github.com"
          git add worker/routes/pwa-factory.ts .github/workflows/pwa-governance-branch-patch.yml
          git commit -m "fix(governance): require explicit approval for new PWAs"
          git push origin HEAD:fix/pwa-governance-coordination
