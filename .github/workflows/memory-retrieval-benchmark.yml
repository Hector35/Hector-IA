name: Memory retrieval benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'model/hector-asi/evals/memory-retrieval/benchmark-v1.json'
      - 'worker/lib/memory-retrieval.ts'
      - 'worker/lib/memory-retrieval.test.ts'
      - 'worker/lib/bounded-read-tools.ts'
      - '.github/workflows/memory-retrieval-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck with retained diagnostics
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm run typecheck 2>&1 | tee artifacts/typecheck.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/typecheck-status.txt
          exit "$status"
      - name: Measure retrieval
        env:
          MEMORY_REPORT_PATH: artifacts/memory-retrieval-v1.json
        run: npx vitest run worker/lib/memory-retrieval.test.ts worker/lib/bounded-read-tools.test.ts
      - name: Verify privacy and owner isolation contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const benchmark=JSON.parse(fs.readFileSync('model/hector-asi/evals/memory-retrieval/benchmark-v1.json','utf8'));
          const report=JSON.parse(fs.readFileSync('artifacts/memory-retrieval-v1.json','utf8'));
          const source=fs.readFileSync('worker/lib/bounded-read-tools.ts','utf8');
          if(benchmark.containsPrivateUserData!==false)throw new Error('benchmark must not contain private data');
          if(benchmark.benchmarkExcludedFromTraining!==true)throw new Error('benchmark must remain excluded from training');
          if(!source.includes('WHERE user_id=? AND ('))throw new Error('owner filter missing before memory ranking');
          if(!source.includes('LIMIT 80'))throw new Error('candidate retrieval must remain bounded');
          if(!report.passed)throw new Error('retrieval thresholds not met');
          if(report.metrics.recallAtK<benchmark.thresholds.recallAtK)throw new Error('recall threshold failed');
          if(report.metrics.precisionAtK<benchmark.thresholds.precisionAtK)throw new Error('precision threshold failed');
          if(report.metrics.mrr<benchmark.thresholds.mrr)throw new Error('MRR threshold failed');
          NODE
      - name: Upload diagnostics and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-retrieval-benchmark-v1-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
