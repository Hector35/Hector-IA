name: Qwen 397B diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/lib/qwen397-runtime.ts'
      - 'worker/lib/qwen397-runtime.test.ts'
      - 'worker/lib/model-pricing.ts'
      - 'worker/lib/model-pricing.test.ts'
      - 'worker/routes/qwen397-chat.ts'
      - '.github/workflows/qwen397-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > qwen397-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat qwen397-typecheck.log
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen397-typecheck
          path: qwen397-typecheck.log
          if-no-files-found: error
      - name: Enforce typecheck
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
