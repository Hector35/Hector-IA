name: V41 priority depth data
on:
  pull_request:
    branches: [main]
    paths:
      - 'model/hector-asi/data/stage6/generate-v41-priority-depth-20260725.py'
      - 'model/hector-asi/data/stage6/verify-v41-priority-depth-20260725.py'
      - '.github/workflows/v41-priority-depth-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile generator and verifier
        run: python -m py_compile model/hector-asi/data/stage6/generate-v41-priority-depth-20260725.py model/hector-asi/data/stage6/verify-v41-priority-depth-20260725.py
      - name: Generate deterministic batch twice
        run: |
          python model/hector-asi/data/stage6/generate-v41-priority-depth-20260725.py >/tmp/generation-a.json
          cp model/hector-asi/data/stage6/v41-priority-depth-20260725.json /tmp/manifest-a.json
          cp model/hector-asi/data/stage6/generated/v41-priority-depth-sft-20260725.jsonl /tmp/sft-a.jsonl
          cp model/hector-asi/data/stage6/generated/v41-priority-depth-preference-20260725.jsonl /tmp/pref-a.jsonl
          rm -f model/hector-asi/data/stage6/v41-priority-depth-20260725.json model/hector-asi/data/stage6/generated/v41-priority-depth-*.jsonl
          python model/hector-asi/data/stage6/generate-v41-priority-depth-20260725.py >/tmp/generation-b.json
          cmp /tmp/manifest-a.json model/hector-asi/data/stage6/v41-priority-depth-20260725.json
          cmp /tmp/sft-a.jsonl model/hector-asi/data/stage6/generated/v41-priority-depth-sft-20260725.jsonl
          cmp /tmp/pref-a.jsonl model/hector-asi/data/stage6/generated/v41-priority-depth-preference-20260725.jsonl
      - name: Verify structure, hashes, deduplication and executable code
        run: python model/hector-asi/data/stage6/verify-v41-priority-depth-20260725.py | tee /tmp/verification.json
      - name: Publish auditable batch
        uses: actions/upload-artifact@v4
        with:
          name: v41-priority-depth-${{ github.run_id }}
          path: |
            model/hector-asi/data/stage6/v41-priority-depth-20260725.json
            model/hector-asi/data/stage6/generated/v41-priority-depth-sft-20260725.jsonl
            model/hector-asi/data/stage6/generated/v41-priority-depth-preference-20260725.jsonl
            /tmp/verification.json
          retention-days: 90
          if-no-files-found: error
