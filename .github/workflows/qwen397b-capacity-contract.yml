name: Qwen 397B capacity contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'model/hector-asi/scale/build_qwen397b_capacity_contract.py'
      - 'model/hector-asi/integration/stage6-integration-latest.json'
      - 'model/hector-asi/data/stage6/generate-cognitive-depth-20260725.py'
      - 'model/hector-asi/stage-6-plan.json'
      - 'model/hector-asi/scale/qwen35-397b-training-admission-v2.json'
      - '.github/workflows/qwen397b-capacity-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile capacity contract and dataset generator
        run: python -m py_compile model/hector-asi/scale/build_qwen397b_capacity_contract.py model/hector-asi/data/stage6/generate-cognitive-depth-20260725.py
      - name: Rebuild verified manifest and generate deterministic contracts
        run: |
          python model/hector-asi/data/stage6/generate-cognitive-depth-20260725.py >/tmp/cognitive-depth-generation.json
          args="--state model/hector-asi/integration/stage6-integration-latest.json --extra-manifest model/hector-asi/data/stage6/cognitive-depth-20260725.json"
          python model/hector-asi/scale/build_qwen397b_capacity_contract.py $args --output /tmp/capacity-a.json
          python model/hector-asi/scale/build_qwen397b_capacity_contract.py $args --output /tmp/capacity-b.json
          cmp /tmp/capacity-a.json /tmp/capacity-b.json
      - name: Verify memory, topology, storage, synchronization and gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/capacity-a.json'))
          assert r['schemaVersion']==3
          assert r['targetModel']=='Qwen/Qwen3.5-397B-A17B'
          assert r['corpus']['canonical']==3800
          assert r['corpus']['verifiedManifestDelta']==0
          assert r['corpus']['effectiveVerified']==3800
          assert r['corpus']['required']==10000
          assert r['corpus']['canonicalStateDriftDetected'] is False
          assert len(r['corpus']['integratedManifestsVerified'])==1
          assert r['corpus']['integratedManifestsVerified'][0]['count']==1200
          assert r['corpus']['unintegratedManifests']==[]
          assert r['trainingAuthorized'] is False and r['decision']=='do-not-train'
          assert r['actualCostMxn']==0 and r['billingActivated'] is False
          assert r['gates']['benchmark'] is True and r['gates']['trainableFailures'] is True
          assert r['gates']['corpus'] is False and r['gates']['canonicalStateSynchronized'] is True
          for gate in ('exactLiveEndpoint','distributedAllocation','realWeightsResume','explicitBudget','frozenHashes'):
              assert r['gates'][gate] is False
          q=next(x for x in r['memoryProfiles'] if x['name']=='qlora4bit-0.2pct')
          f=next(x for x in r['memoryProfiles'] if x['name']=='full16bit')
          assert q['estimatedPeakGiB']>250 and f['estimatedPeakGiB']>4900
          assert r['storageContract']['minimumObjectStorageGiB']>14000
          assert r['storageContract']['verifiedRemoteBucket'] is False
          assert all(t['verifiedAllocation'] is False for t in r['candidateTopologies'])
          assert r['endpointAttestationContract']['fallbackMustBe'] is False
          assert r['endpointAttestationContract']['liveInferencePerformed'] is False
          assert r['bandwidthPlanning']['measured'] is False
          PY
      - name: Publish auditable capacity contract
        uses: actions/upload-artifact@v4
        with:
          name: qwen397b-capacity-contract-${{ github.run_id }}
          path: /tmp/capacity-a.json
          retention-days: 90
          if-no-files-found: error
