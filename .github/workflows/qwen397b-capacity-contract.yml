name: Qwen 397B capacity contract
on:
  pull_request:
    branches: [main]
    paths: ['model/hector-asi/scale/build_qwen397b_capacity_contract.py','model/hector-asi/integration/stage6-integration-latest.json','model/hector-asi/data/stage6/generate-cognitive-depth-20260725.py','model/hector-asi/stage-6-plan.json','model/hector-asi/scale/qwen35-397b-training-admission-v2.json','.github/workflows/qwen397b-capacity-contract.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile model/hector-asi/scale/build_qwen397b_capacity_contract.py model/hector-asi/data/stage6/generate-cognitive-depth-20260725.py
      - name: Generate deterministic contract and verify integrated manifest
        run: |
          python model/hector-asi/data/stage6/generate-cognitive-depth-20260725.py >/tmp/generation.json
          args="--state model/hector-asi/integration/stage6-integration-latest.json --extra-manifest model/hector-asi/data/stage6/cognitive-depth-20260725.json"
          python model/hector-asi/scale/build_qwen397b_capacity_contract.py $args --output /tmp/capacity-a.json
          python model/hector-asi/scale/build_qwen397b_capacity_contract.py $args --output /tmp/capacity-b.json
          cmp /tmp/capacity-a.json /tmp/capacity-b.json
      - name: Verify capacity and fail-closed gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/capacity-a.json'))
          assert r['schemaVersion']==4 and r['targetModel']=='Qwen/Qwen3.5-397B-A17B'
          assert r['corpus']['canonical']==5400 and r['corpus']['effectiveVerified']==5400
          assert r['corpus']['verifiedManifestDelta']==0 and not r['corpus']['canonicalStateDriftDetected']
          assert len(r['corpus']['integratedManifestsVerified'])==1 and r['corpus']['integratedManifestsVerified'][0]['count']==1200
          assert r['corpus']['unintegratedManifests']==[]
          assert r['gates']['benchmarkHash'] is True and r['gates']['benchmarkAggregateConsistency'] is False
          assert r['gates']['trainableFailures'] is True and r['gates']['corpus'] is False and r['gates']['canonicalStateSynchronized'] is True
          assert not r['trainingAuthorized'] and r['decision']=='do-not-train' and r['actualCostMxn']==0 and not r['billingActivated']
          assert r['storageContract']['minimumObjectStorageGiB']>14000 and not r['storageContract']['verifiedRemoteBucket']
          assert all(not t['verifiedAllocation'] for t in r['candidateTopologies'])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'qwen397b-capacity-contract-${{ github.run_id }}', path: /tmp/capacity-a.json, retention-days: 90, if-no-files-found: error}
