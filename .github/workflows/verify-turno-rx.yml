name: Verify Turno RX

on:
  push:
    branches: [main]
    paths:
      - 'public/turno-rx/**'
      - 'worker/routes/qwen397-vision.ts'
      - 'tests/turno-rx-pwa.test.ts'
      - '.github/workflows/verify-turno-rx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Esperar publicación de Pendientes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE/" -o /tmp/index.html && grep -q 'app-v15.js?v=1' /tmp/index.html && grep -q 'integrity-v15.css?v=1' /tmp/index.html; then
              exit 0
            fi
            sleep 4
          done
          echo 'Pendientes v15 no apareció en producción dentro del tiempo esperado.'
          exit 1

      - name: Verificar captura e integridad operativa
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          curl -fsS "$BASE/app-v15.js?v=1" -o /tmp/app.mjs
          curl -fsS "$BASE/integrity-v15.css?v=1" -o /tmp/integrity.css
          curl -fsS "$BASE/manifest.webmanifest" -o /tmp/manifest.webmanifest
          curl -fsS "$BASE/sw.js" -o /tmp/sw.js
          node --check /tmp/app.mjs
          grep -q 'galleryCapture' /tmp/app.mjs
          grep -q 'manualCapture' /tmp/app.mjs
          grep -q 'newShift' /tmp/app.mjs
          grep -q 'undoRemove' /tmp/app.mjs
          grep -q 'findConflictsAgainstExisting' /tmp/app.mjs
          grep -q 'isIncompleteFloorRow' /tmp/app.mjs
          grep -q 'No cuentan en el total hasta tener Origen + Destino' /tmp/app.mjs
          grep -q 'Segundo de la otra unidad' /tmp/app.mjs
          grep -q '<th>Origen</th><th>Destino</th>' /tmp/app.mjs
          ! grep -q 'cameraCapture' /tmp/app.mjs
          grep -q 'undo-bar' /tmp/integrity.css
          grep -q 'form-error' /tmp/integrity.css
          grep -q '"short_name": "Pendientes"' /tmp/manifest.webmanifest
          grep -q "turno-rx-shell-v15" /tmp/sw.js
          grep -q 'app-v15.js?v=1' /tmp/sw.js
          grep -q 'integrity-v15.css?v=1' /tmp/sw.js

      - name: Verificar visión sin login
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://hector-os.hectorhdzr035.workers.dev'
          code="$(curl -sS -o /tmp/turno-rx-vision.json -w '%{http_code}' -X POST -H 'X-Turno-RX: 1' -H "Origin: $ORIGIN" -F 'prompt=verify' "$ORIGIN/api/turno-rx/vision")"
          test "$code" = '400'
          grep -q 'Imagen inválida' /tmp/turno-rx-vision.json