name: Verify Turno RX

on:
  push:
    branches: [main]
    paths:
      - 'public/turno-rx/**'
      - '.github/workflows/verify-turno-rx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Esperar publicación de la PWA
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE/" | grep -q '<title>Turno RX</title>'; then
              exit 0
            fi
            sleep 4
          done
          echo 'Turno RX no apareció en producción dentro del tiempo esperado.'
          exit 1
      - name: Verificar shell, manifest y service worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          curl -fsS "$BASE/" | grep -q '/turno-rx/app.js'
          curl -fsS "$BASE/manifest.webmanifest" | grep -q '"short_name": "Turno RX"'
          curl -fsS "$BASE/sw.js" | grep -q "url.pathname.startsWith('/api/')"
          curl -fsS "$BASE/app.js" | grep -q "fetch('/api/vision'"
      - name: Verificar que el backend de sesión existe
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/auth-me.json -w '%{http_code}' https://hector-os.hectorhdzr035.workers.dev/api/auth/me)"
          test "$code" = '200' -o "$code" = '401' -o "$code" = '403'
