name: Verify Turno RX

on:
  push:
    branches: [main]
    paths:
      - 'public/turno-rx/**'
      - 'worker/routes/qwen397-vision.ts'
      - 'tests/turno-rx-pwa.test.ts'
      - '.github/workflows/verify-turno-rx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Esperar publicación de Pendientes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE/" -o /tmp/index.html && grep -q 'app.js?v=9' /tmp/index.html && grep -q 'capture-enhancements.css?v=1' /tmp/index.html; then
              exit 0
            fi
            sleep 4
          done
          echo 'Pendientes actualizado no apareció en producción dentro del tiempo esperado.'
          exit 1

      - name: Verificar captura y datos operativos
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          curl -fsS "$BASE/" -o /tmp/index.html
          curl -fsS "$BASE/app.js?v=9" -o /tmp/app.js
          curl -fsS "$BASE/capture-enhancements.css?v=1" -o /tmp/capture.css
          curl -fsS "$BASE/manifest.webmanifest" -o /tmp/manifest.webmanifest
          curl -fsS "$BASE/sw.js" -o /tmp/sw.js
          grep -q 'cameraCapture' /tmp/app.js
          grep -q 'galleryCapture' /tmp/app.js
          grep -q 'manualCapture' /tmp/app.js
          grep -q '/api/turno-rx/vision' /tmp/app.js
          grep -q 'X-Turno-RX' /tmp/app.js
          grep -q 'Nombre / edad' /tmp/app.js
          grep -q 'Traslado / motivo' /tmp/app.js
          grep -q 'oxygenProbable' /tmp/app.js
          grep -q 'capture-icon-btn' /tmp/capture.css
          grep -q '"short_name": "Pendientes"' /tmp/manifest.webmanifest
          grep -q "turno-rx-shell-v8" /tmp/sw.js
          grep -q 'capture-enhancements.css?v=1' /tmp/sw.js
          grep -q 'app.js?v=9' /tmp/sw.js

      - name: Verificar visión sin login
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://hector-os.hectorhdzr035.workers.dev'
          code="$(curl -sS -o /tmp/turno-rx-vision.json -w '%{http_code}' -X POST -H 'X-Turno-RX: 1' -H "Origin: $ORIGIN" -F 'prompt=verify' "$ORIGIN/api/turno-rx/vision")"
          test "$code" = '400'
          grep -q 'Imagen inválida' /tmp/turno-rx-vision.json
