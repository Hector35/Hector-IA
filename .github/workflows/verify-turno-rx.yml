name: Verify Turno RX

on:
  push:
    branches: [main]
    paths:
      - 'public/turno-rx/**'
      - 'worker/routes/qwen397-vision.ts'
      - '.github/workflows/verify-turno-rx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Esperar publicación de la PWA
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE/" -o /tmp/turno-rx-index.html && grep -q '/turno-rx/direct-vision.js' /tmp/turno-rx-index.html; then
              exit 0
            fi
            sleep 4
          done
          echo 'Turno RX actualizado no apareció en producción dentro del tiempo esperado.'
          exit 1
      - name: Verificar selección directa, manifest y service worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          curl -fsS "$BASE/" -o /tmp/index.html
          curl -fsS "$BASE/direct-vision.js" -o /tmp/direct-vision.js
          curl -fsS "$BASE/gallery-fix.js" -o /tmp/gallery-fix.js
          curl -fsS "$BASE/manifest.webmanifest" -o /tmp/manifest.webmanifest
          curl -fsS "$BASE/sw.js" -o /tmp/sw.js
          grep -q '/turno-rx/direct-vision.js' /tmp/index.html
          grep -q '/api/turno-rx/vision' /tmp/direct-vision.js
          grep -q 'X-Turno-RX' /tmp/direct-vision.js
          grep -q 'removeSessionNotice' /tmp/direct-vision.js
          grep -q "removeAttribute('capture')" /tmp/gallery-fix.js
          grep -q "setAttribute('multiple'" /tmp/gallery-fix.js
          grep -q 'Seleccionar fotos' /tmp/gallery-fix.js
          grep -q 'importMany' /tmp/gallery-fix.js
          grep -q '"short_name": "Turno RX"' /tmp/manifest.webmanifest
          grep -q "turno-rx-shell-v4" /tmp/sw.js
          grep -q '/turno-rx/direct-vision.js' /tmp/sw.js
      - name: Verificar visión de Turno RX sin login
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://hector-os.hectorhdzr035.workers.dev'
          code="$(curl -sS -o /tmp/turno-rx-vision.json -w '%{http_code}' -X POST -H 'X-Turno-RX: 1' -H "Origin: $ORIGIN" -F 'prompt=verify' "$ORIGIN/api/turno-rx/vision")"
          test "$code" = '400'
          grep -q 'Imagen inválida' /tmp/turno-rx-vision.json
