name: Verify Turno RX

on:
  push:
    branches: [main]
    paths:
      - 'public/turno-rx/**'
      - '.github/workflows/verify-turno-rx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Esperar publicación de la PWA
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE/" -o /tmp/turno-rx-index.html && grep -q '/turno-rx/gallery-fix.js' /tmp/turno-rx-index.html; then
              exit 0
            fi
            sleep 4
          done
          echo 'Turno RX actualizado no apareció en producción dentro del tiempo esperado.'
          exit 1
      - name: Verificar shell, selección múltiple, manifest y service worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hector-os.hectorhdzr035.workers.dev/turno-rx'
          curl -fsS "$BASE/" -o /tmp/index.html
          curl -fsS "$BASE/gallery-fix.js" -o /tmp/gallery-fix.js
          curl -fsS "$BASE/manifest.webmanifest" -o /tmp/manifest.webmanifest
          curl -fsS "$BASE/sw.js" -o /tmp/sw.js
          curl -fsS "$BASE/app.js" -o /tmp/app.js
          grep -q '/turno-rx/app.js' /tmp/index.html
          grep -q '/turno-rx/gallery-fix.js' /tmp/index.html
          grep -q "removeAttribute('capture')" /tmp/gallery-fix.js
          grep -q "setAttribute('multiple'" /tmp/gallery-fix.js
          grep -q 'Seleccionar fotos' /tmp/gallery-fix.js
          grep -q 'importMany' /tmp/gallery-fix.js
          grep -q 'files.length <= 1' /tmp/gallery-fix.js
          grep -q '"short_name": "Turno RX"' /tmp/manifest.webmanifest
          grep -q "turno-rx-shell-v3" /tmp/sw.js
          grep -q '/turno-rx/gallery-fix.js' /tmp/sw.js
          grep -q "fetch('/api/vision'" /tmp/app.js
      - name: Verificar que el backend de sesión existe
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/auth-me.json -w '%{http_code}' https://hector-os.hectorhdzr035.workers.dev/api/auth/me)"
          test "$code" = '200' -o "$code" = '401' -o "$code" = '403'
