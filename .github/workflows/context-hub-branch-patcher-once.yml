name: Context Hub branch patcher once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/context-hub-branch-patcher-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-hub-memory-vault-v2-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair D1 generic calls in Context Hub
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('worker/routes/context-hub.ts')
          s=p.read_text()
          fixed=re.sub(r'\.(first|all)<[^()\n]+>\(\)', lambda m: f'.{m.group(1)}()', s)
          if fixed == s:
              raise SystemExit('no generic D1 calls found to repair')
          p.write_text(fixed)
          Path('.github/workflows/context-hub-fix-once.yml').unlink(missing_ok=True)
      - name: Verify target branch
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/context-hub.test.ts tests/hector-agent-resilience.test.ts tests/hector-bridge-core.test.ts
          npm run build
      - name: Commit target branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/routes/context-hub.ts .github/workflows/context-hub-fix-once.yml
          git commit -m 'fix(context-hub): type D1 calls through runtime context'
          git push origin HEAD:feat/context-hub-memory-vault-v2-20260822
      - name: Remove this temporary workflow from main
        if: success()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm -f .github/workflows/context-hub-branch-patcher-once.yml
          git commit -m 'chore: remove one-time Context Hub branch patcher'
          git push origin HEAD:main
