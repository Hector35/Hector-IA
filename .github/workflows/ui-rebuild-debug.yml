name: UI rebuild concise validation

on:
  push:
    branches:
      - ui-rebuild/20260724-brutal
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concise-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Capture tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/hector-test.log 2>&1
          status=$?
          tail -n 180 /tmp/hector-test.log > /tmp/hector-test-tail.log
          if [ "$status" -ne 0 ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Upload concise test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-rebuild-test-tail
          path: /tmp/hector-test-tail.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when tests failed
        if: steps.tests.outputs.failed == 'true'
        run: cat /tmp/hector-test-tail.log && exit 1
      - name: Build
        if: steps.tests.outputs.failed != 'true'
        run: npm run build
