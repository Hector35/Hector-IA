name: Failure-driven Stage 6 data
on:
  pull_request:
    branches: [main]
    paths:
      - 'model/hector-asi/data/stage6/generate-failure-driven-20260725.py'
      - 'model/hector-asi/data/stage6/verify-failure-driven-20260725.py'
      - '.github/workflows/failure-driven-data-20260725.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate deterministic batch twice
        run: |
          python model/hector-asi/data/stage6/generate-failure-driven-20260725.py
          cp model/hector-asi/data/stage6/failure-driven-20260725.json /tmp/manifest-a.json
          python model/hector-asi/data/stage6/generate-failure-driven-20260725.py
          cmp /tmp/manifest-a.json model/hector-asi/data/stage6/failure-driven-20260725.json
      - name: Verify data, code, hashes and leakage
        run: python model/hector-asi/data/stage6/verify-failure-driven-20260725.py
      - name: Publish auditable batch
        uses: actions/upload-artifact@v4
        with:
          name: failure-driven-stage6-${{ github.run_id }}
          path: |
            model/hector-asi/data/stage6/generated/failure-driven-sft-20260725.jsonl
            model/hector-asi/data/stage6/generated/failure-driven-preference-20260725.jsonl
            model/hector-asi/data/stage6/failure-driven-20260725.json
          retention-days: 90
          if-no-files-found: error
