name: Qwen 397B provider readiness

on:
  pull_request:
    paths:
      - 'model/hector-asi/scale/qwen397b-provider-plan.json'
      - 'model/hector-asi/scale/smoke_qwen397b_endpoint.py'
      - 'model/hector-asi/scale/estimate_qwen397b_cost.py'
      - '.github/workflows/qwen397b-provider-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-without-secrets-or-spend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile endpoint and cost verifiers
        run: python -m py_compile model/hector-asi/scale/smoke_qwen397b_endpoint.py model/hector-asi/scale/estimate_qwen397b_cost.py
      - name: Validate provider decision and closed billing gates
        run: |
          python - <<'PY'
          import importlib.util, json
          from decimal import Decimal
          from pathlib import Path

          plan=json.loads(Path('model/hector-asi/scale/qwen397b-provider-plan.json').read_text())
          assert plan['schemaVersion']==2
          assert plan['targetModel']=='Qwen/Qwen3.5-397B-A17B'
          assert plan['decision']=='managed-serverless-api-first'
          assert plan['status']=='blocked-before-checkout'
          assert plan['spend']['actualMxn']==0
          assert plan['spend']['maximumMxn'] is None
          assert plan['spend']['billingEnabled'] is False
          assert plan['effectiveEndpointVerified'] is False
          assert plan['preferred']['provider']=='Together AI'
          assert plan['preferred']['modelId']=='Qwen/Qwen3.5-397B-A17B'
          assert plan['preferred']['pricing']['batchAvailable'] is False
          assert plan['alternatives'][0]['freeQuota']['verifiedForOwnerAccount'] is False
          assert plan['alternatives'][1]['minimumPublishedHourlyPrice']=={'currency':'USD','amount':112}
          assert not any(plan['activationGates'].values())

          smoke_spec=importlib.util.spec_from_file_location('smoke','model/hector-asi/scale/smoke_qwen397b_endpoint.py')
          smoke=importlib.util.module_from_spec(smoke_spec);smoke_spec.loader.exec_module(smoke)
          assert smoke.normalize_model('Qwen/Qwen3.5-397B-A17B')=='qwen/qwen3.5-397b-a17b'
          assert smoke.verify_effective_model({'model':'Qwen/Qwen3.5-397B-A17B'},'Qwen/Qwen3.5-397B-A17B')=='Qwen/Qwen3.5-397B-A17B'
          try:
              smoke.verify_effective_model({'model':'Qwen/Qwen3-30B-A3B'},'Qwen/Qwen3.5-397B-A17B')
          except RuntimeError:
              pass
          else:
              raise AssertionError('fallback/model mismatch was not rejected')

          cost_spec=importlib.util.spec_from_file_location('cost','model/hector-asi/scale/estimate_qwen397b_cost.py')
          cost=importlib.util.module_from_spec(cost_spec);cost_spec.loader.exec_module(cost)
          report=cost.estimate(requests=1000,input_tokens=2000,cached_input_tokens=500,output_tokens=500,input_per_million=Decimal('0.60'),cached_input_per_million=Decimal('0.35'),output_per_million=Decimal('3.60'),usd_to_mxn=Decimal('20'))
          assert report['estimated']['usdTotal']=='2.8750'
          assert report['estimated']['mxnTotal']=='57.5000'
          assert report['billingActivated'] is False
          PY
      - name: Prove missing budget blocks a bounded workload
        shell: bash
        run: |
          set +e
          python model/hector-asi/scale/estimate_qwen397b_cost.py \
            --requests 1000 --input-tokens 2000 --cached-input-tokens 500 --output-tokens 500 \
            --usd-to-mxn 20 --output /tmp/qwen397b-cost-blocked.json
          status=$?
          test "$status" -eq 2
          python - <<'PY'
          import json
          report=json.load(open('/tmp/qwen397b-cost-blocked.json'))
          assert report['budgetGate']['open'] is False
          assert report['budgetGate']['maximumMxn'] is None
          assert report['estimated']['mxnTotal']=='57.5000'
          PY
      - name: Prove an explicit ceiling can open estimation without activating billing
        run: |
          python model/hector-asi/scale/estimate_qwen397b_cost.py \
            --requests 1000 --input-tokens 2000 --cached-input-tokens 500 --output-tokens 500 \
            --usd-to-mxn 20 --maximum-mxn 60 --output /tmp/qwen397b-cost-approved.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/qwen397b-cost-approved.json'))
          assert report['budgetGate']['open'] is True
          assert report['billingActivated'] is False
          assert report['secretValuesRecorded'] is False
          PY
      - name: Prove missing secrets cannot call a paid endpoint
        shell: bash
        run: |
          set +e
          python model/hector-asi/scale/smoke_qwen397b_endpoint.py --output /tmp/qwen397b.json
          status=$?
          test "$status" -ne 0
          test ! -f /tmp/qwen397b.json
