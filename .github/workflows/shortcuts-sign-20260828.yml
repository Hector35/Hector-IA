name: Sign Shortcuts templates on macOS

on:
  push:
    branches: [codex/shortcuts-sign-20260828]
    paths:
      - '.github/workflows/shortcuts-sign-20260828.yml'
      - 'shortcuts-workbench-build/**'

permissions:
  contents: read

concurrency:
  group: shortcuts-sign-20260828
  cancel-in-progress: false

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Checkout templates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Sign with the native Apple command
        run: python3 shortcuts-workbench-build/sign_native.py
      - name: Preserve output and verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-shortcuts-20260828
          path: shortcuts-workbench-build/output/
          if-no-files-found: error
          retention-days: 7
