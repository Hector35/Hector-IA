name: Intelligence state consistency

on:
  pull_request:
    branches: [main]
    paths:
      - 'model/hector-asi/integration/stage6-integration-latest.json'
      - 'model/hector-asi/stage-6-plan.json'
      - 'model/hector-asi/system-quality-contract.json'
      - 'model/hector-asi/ui-quality-evidence.json'
      - 'model/hector-asi/data/stage6/generate-cognitive-depth-20260725.py'
      - 'model/hector-asi/registry/chat-champion.json'
      - 'model/hector-asi/evals/benchmark_v2/v41-benchmark-v2-latest.json'
      - 'model/hector-asi/scale/qwen35-397b-training-admission-v2.json'
      - 'model/hector-asi/verify_intelligence_state.py'
      - 'worker/intelligence/intelligence-state.ts'
      - 'worker/intelligence/stage-six.ts'
      - 'worker/intelligence/system-quality.ts'
      - 'worker/intelligence/system-quality.test.ts'
      - 'worker/routes/system.ts'
      - 'src/api.ts'
      - 'src/api.test.ts'
      - 'src/HectorASIEvolutionApp.tsx'
      - 'src/hector-reboot.css'
      - 'tests/accessibility-shell-contract.test.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/intelligence-state-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild deterministic integrated manifest
        run: python model/hector-asi/data/stage6/generate-cognitive-depth-20260725.py >/tmp/cognitive-depth-generation.json
      - name: Verify canonical state and all consumers
        run: python model/hector-asi/verify_intelligence_state.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: npx vitest run worker/lib/cognitive-runtime.test.ts worker/lib/qwen397-runtime.test.ts worker/intelligence/system-quality.test.ts src/api.test.ts tests/accessibility-shell-contract.test.ts
